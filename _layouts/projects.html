---
layout: default
---

<section class="flex flex-col gap-2" aria-labelledby="projects-heading">
  <h1 id="projects-heading" class="text-2xl font-bold tracking-wide text-stone-900">My projects</h1>

  <ul class="flex flex-col gap-2">
    {% for project in site.projects %}
    <li class="flex gap-4 p-4 hover:bg-stone-300/60 transition-all duration-300 rounded-xl group hover:-translate-y-1">
      <article class="flex gap-2 w-full">
        <a href="{{ project.url }}" class="flex gap-2">
          <img src="{{ project.thumbnail }}" alt="{{ project.title }} thumbnail" class="w-32 h-32 rounded-lg border border-stone-500" loading="lazy" decoding="async">

          <div class="flex flex-col gap-2">
            <h2 class="text-xl font-semibold">{{ project.title }}</h2>
            <p class="flex-grow">{{ project.description }}</p>

            <ul class="flex flex-wrap gap-2" aria-label="Technologies used">
              {% for badge in project.badges %}
              <li><img src="{{ badge }}" alt="" role="presentation"></li>
              {% endfor %}
            </ul>
          </div>
        </a>
      </article>
    </li>
    {% endfor %}
  </ul>
</section>

{{ content }}
